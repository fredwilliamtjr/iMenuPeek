name: iMenuPeek
options:
  bundleIdPrefix: com.smartfull
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    # 版本默认值;发布时 scripts/release.sh 用 tag 覆盖 MARKETING_VERSION + 单调的 CURRENT_PROJECT_VERSION,
    # 经下方 Info.plist 的 $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION) 注入。
    # iMenuPeek 不带自动更新(Sparkle 已移除):新版本只经 GitHub Releases 发布。
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # 签名由 Local.xcconfig 控制（默认 ad-hoc；正式分发用 Developer ID）
targets:
  iMenuPeek:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["PresetScripts/**", "ActionExamples/**"]
      - path: App/PresetScripts
        buildPhase: resources
        optional: true
      - path: App/ActionExamples
        buildPhase: resources
    dependencies:
      - package: MenuMateCore
      - target: FinderExtension
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iMenuPeek
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        # 「前往上一层级目录 / 前往所在目录」等预设用 osascript 控制 Finder 做同窗导航；
        # 主 App 非沙盒，发 Apple Event 需声明此用途串，否则 macOS 自动化授权会被静默拒。
        NSAppleEventsUsageDescription: "O iMenuPeek controla o Finder nas ações do menu de botão direito que você ativar, para navegar na própria janela (como \"Subir um nível\")."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartfull.imenupeek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FinderExtension:
    type: app-extension
    platform: macOS
    sources: [FinderExtension]
    dependencies:
      - package: MenuMateCore
    info:
      path: FinderExtension/Info.plist
      properties:
        CFBundleDisplayName: iMenuPeek Finder Extension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: FinderExtension/FinderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Única leitura de arquivo da extensão: a chave de IPC (IPCAuth) criada pelo app.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/iMenuPeek/IPC/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartfull.imenupeek.FinderExtension
packages:
  MenuMateCore:
    path: Core
schemes:
  iMenuPeek:
    build:
      targets:
        iMenuPeek: all
    run:
      config: Debug
